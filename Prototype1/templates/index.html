<!DOCTYPE html>
<html>
<head>
    <title>Classroom Allotment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">

        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Automatic Classroom Allotment</h2>

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Upload Student Excel Sheet</label>
                    <input type="file" class="form-control" name="excel_file" required>
                    <small class="text-muted">Required columns: <b>Name, Roll, Class</b></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Max Capacity per Room</label>
                    <input type="number" class="form-control" name="capacity" value="50" min="1" required>
                </div>

                <button class="btn btn-primary w-100">Generate Allotment</button>
            </form>
        </div>
    </div>
</body>
</html>
